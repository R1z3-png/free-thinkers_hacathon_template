name: Android build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK Platform 37 and Build Tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build and run unit tests
        run: bash ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug
