name: Android build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 37
        run: sdkmanager "platforms;android-37"
      - name: Build and run unit tests
        run: bash ./gradlew --no-daemon clean :app:testDebugUnitTest :app:assembleDebug